name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop-file-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils
      # shellcheck and jq come with the runner image.
      - run: tests/lint.sh
