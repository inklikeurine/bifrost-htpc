# Sound goes to the TV. The HDMI/DisplayPort outputs share one sound card with the
# analog outputs, and WirePlumber ranks analog higher, so a box with a built-in
# speaker (like the ThinkCentre) plays through that instead. The TV's output only
# counts as available while the screen is on; WirePlumber re-checks these priorities
# each time it appears, so sound moves to the TV whenever the screen wakes.
# With no TV output available it falls back to its usual choice.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        priorities = [
          "output:hdmi-stereo"
          "output:hdmi-stereo-extra1"
          "output:hdmi-stereo-extra2"
          "output:hdmi-stereo-extra3"
        ]
      }
    }
  }
]
